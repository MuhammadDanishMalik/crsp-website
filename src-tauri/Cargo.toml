[package]
name = "crsp-pos-desktop"
version = "0.1.0"
description = "CRSP POS desktop shell: kiosk window + direct printer access"
edition = "2021"

[lib]
name = "crsp_pos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
serialport = "4"
