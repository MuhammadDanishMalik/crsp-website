[build]
  # Changes that only touch the VPS scripts in /deploy do not need a Netlify build (each build costs credits).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)deploy'"
  # Next.js sometimes stops its first build to show an upgrade notice ("run the same command again"): retry once.
  command = "npm run build || npm run build"

[build.environment]
  NODE_VERSION = "22"
  # The admin e-mail is not a secret and also appears in the code as a default; do not let the secret scan fail the deploy over it.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,ADMIN_PASSWORD"
